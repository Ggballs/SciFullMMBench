services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scifull-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scifullmmbench}
      POSTGRES_USER: ${POSTGRES_USER:-scifull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-westlakenlp}
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-scifull} -d ${POSTGRES_DB:-scifullmmbench}"]
      interval: 10s
      timeout: 5s
      retries: 12

  gradio:
    build:
      context: .
      network: host
    container_name: scifull-gradio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUMAN_FEEDBACK_DB_URL: postgresql+psycopg://${POSTGRES_USER:-scifull}:${POSTGRES_PASSWORD:-westlakenlp}@postgres:5433/${POSTGRES_DB:-scifullmmbench}
      OPENREVIEW_PIPELINE_LOG_DIR: /app/logs
      HUMAN_FEEDBACK_LOG_DIR: /app/logs
      HUMAN_FEEDBACK_USERS: ${HUMAN_FEEDBACK_USERS:-}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      FINAL_JSON: ${FINAL_JSON:-outputs/final_pipeline_output.json}
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    volumes:
      - ${SCIFULL_LOGS_DIR:-./logs}:/app/logs
      - ${SCIFULL_OUTPUTS_DIR:-./outputs}:/app/outputs
      - /data3:/data3:ro

volumes:
  postgres-data:
