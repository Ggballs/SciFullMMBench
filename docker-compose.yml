services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scifull-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scifullmmbench}
      POSTGRES_USER: ${POSTGRES_USER:-scifull}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-westlakenlp}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-scifull} -d ${POSTGRES_DB:-scifullmmbench}"]
      interval: 10s
      timeout: 5s
      retries: 12

  gradio:
    build:
      context: .
      network: host
    container_name: scifull-gradio
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUMAN_FEEDBACK_DB_URL: postgresql+psycopg://${POSTGRES_USER:-scifull}:${POSTGRES_PASSWORD:-westlakenlp}@postgres:5432/${POSTGRES_DB:-scifullmmbench}
      SCIFULL_GOLDEN_EMBEDDING_DB_URL: postgresql+psycopg://${POSTGRES_USER:-scifull}:${POSTGRES_PASSWORD:-westlakenlp}@postgres:5432/${POSTGRES_DB:-scifullmmbench}
      SCIFULL_EMBEDDING_SERVICE_URL: ${SCIFULL_EMBEDDING_SERVICE_URL:-http://host.docker.internal:18080/embed}
      OPENREVIEW_PIPELINE_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_USERS: ${HUMAN_FEEDBACK_USERS:-}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
      FINAL_JSON: ${FINAL_JSON:-outputs/final_pipeline_output.json}
    ports:
      - "${GRADIO_PORT:-7860}:7860"
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - ./src:/app/src:ro
      - ./tests/scripts:/app/tests/scripts:ro
      - ${SCIFULL_LOGS_DIR:-./outputs/logs}:/app/outputs/logs
      - ${SCIFULL_OUTPUTS_DIR:-./outputs}:/app/outputs
      - /data3:/data3:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  query-writing:
    build:
      context: .
      network: host
    container_name: scifull-query-writing
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUMAN_FEEDBACK_DB_URL: postgresql+psycopg://${POSTGRES_USER:-scifull}:${POSTGRES_PASSWORD:-westlakenlp}@postgres:5432/${POSTGRES_DB:-scifullmmbench}
      OPENREVIEW_PIPELINE_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_USERS: ${HUMAN_FEEDBACK_USERS:-}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7862
      FINAL_JSON: ${FINAL_JSON:-outputs/final_pipeline_output.json}
      PDF_CACHE_HOST: ${PDF_CACHE_HOST:-10.0.1.226}
      PDF_CACHE_PORT: ${PDF_CACHE_PORT:-8763}
    ports:
      - "${QUERY_WRITING_PORT:-7862}:7862"
      - "${PDF_CACHE_PORT:-8763}:8763"
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - ./src:/app/src:ro
      - ./tests/scripts:/app/tests/scripts:ro
      - ${SCIFULL_LOGS_DIR:-./outputs/logs}:/app/outputs/logs
      - ${SCIFULL_OUTPUTS_DIR:-./outputs}:/app/outputs
      - ${SCIFULL_PDF_CACHE_DIR:-./pdf_cache}:/app/pdf_cache
    command:
      - sh
      - -c
      - "python outputs/display_query_writing_gradio.py --port 7862"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  query-pair-eval:
    build:
      context: .
      network: host
    container_name: scifull-query-pair-eval
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HUMAN_FEEDBACK_DB_URL: postgresql+psycopg://${POSTGRES_USER:-scifull}:${POSTGRES_PASSWORD:-westlakenlp}@postgres:5432/${POSTGRES_DB:-scifullmmbench}
      OPENREVIEW_PIPELINE_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_LOG_DIR: /app/outputs/logs
      HUMAN_FEEDBACK_USERS: ${HUMAN_FEEDBACK_USERS:-}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7864
      QUERY_PAIRS_JSON: ${QUERY_PAIRS_JSON:-outputs/query_pairs.json}
    ports:
      - "${QUERY_PAIR_EVAL_PORT:-7864}:7864"
    volumes:
      - ./src:/app/src:ro
      - ${SCIFULL_LOGS_DIR:-./outputs/logs}:/app/outputs/logs
      - ${SCIFULL_OUTPUTS_DIR:-./outputs}:/app/outputs
    command:
      - sh
      - -c
      - "python outputs/display_query_pair_evaluation_gradio.py --query-pairs \"$$QUERY_PAIRS_JSON\" --port 7864"

volumes:
  postgres-data:
