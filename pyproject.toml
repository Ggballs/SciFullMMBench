[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openreview-pipeline"
version = "0.1.0"
description = "3-stage OpenReview processing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "tenacity>=8.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
openreview = [
    "openreview>=2.0",
]

[project.scripts]
openreview-pipeline = "openreview_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
