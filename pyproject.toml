[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openreview-pipeline"
version = "0.1.0"
description = "OpenReview processing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "tenacity>=8.0",
    "tqdm>=4.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openai>=1.0",
    "openreview-py>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]
scholar = [
    "scholarly>=1.7.11",
]
ui = [
    "gradio>=4.0",
]
deploy-postgres = [
    "gradio>=4.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "pypdf>=4.0",
    "scholarly>=1.7.11",
]
vector = [
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
]
embedding-service = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sentence-transformers>=3.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
]
pdf = [
    "pillow>=10.0",
    "pypdf>=4.0",
]
docling = [
    "docling>=2.0",
    "docling-core>=2.0",
]
legacy-mysql-export = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
]

[project.scripts]
openreview-pipeline = "openreview_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openreview_pipeline = [
    "prompts/*.txt",
    "prompts/*.json",
    "prompts/query_analysis/*.txt",
]

[tool.ruff]
line-length = 100
target-version = "py39"
